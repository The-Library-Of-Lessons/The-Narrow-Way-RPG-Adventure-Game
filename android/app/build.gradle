plugins { id 'com.android.application' }

android {
    namespace 'org.libraryoflessons.narrowway'
    compileSdk 35
    defaultConfig {
        applicationId 'org.libraryoflessons.narrowway'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    sourceSets.main.assets.srcDir layout.buildDirectory.dir('generated/gameAssets')
}

// Bundle the same files as the website, preserving their relative paths.
tasks.register('syncGameAssets', Sync) {
    from(rootProject.file('..')) {
        include 'index.html', 'styles.css', 'src/**', 'assets/**'
        include 'LICENSE', 'ASSET-LICENSE.md', 'SCRIPTURE-SOURCES.md'
    }
    into layout.buildDirectory.dir('generated/gameAssets/game')
}
tasks.named('preBuild').configure { dependsOn 'syncGameAssets' }

dependencies { implementation 'androidx.webkit:webkit:1.12.1' }
